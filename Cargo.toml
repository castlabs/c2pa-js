
[workspace]
resolver = '2'
members = ['packages/c2pa-wasm', 'packages/c2pa-types', 'packages/c2pa-node']

[workspace.package]
rust-version = "1.96.0"

[workspace.dependencies]
c2pa = { git = "https://github.com/castlabs/c2pa-rs", rev = "6021100cc5060b06061ca15b634281cfeb97c718", features = [
    "unstable_builder_filter",
    "unstable_live_video",
    "pdf",
    "rust_native_crypto",
    "fetch_remote_manifests",
    "json_schema",
    "http_reqwest",
], default-features = false }

[profile.release]
opt-level = "s"
lto = true
